[project]
name = "array-sampling"
version = "0.1.0"
description = "Practical sampling utilities for arrays and streams."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[dependency-groups]
dev = [
    "basedpyright>=1.21",
    "mypy>=1.13",
    "numpy>=1.24",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/array_sampling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "recommended"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 7
